<title>蛋币刷题乐园（数学版）</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--pri:#ff8f3d;--pri2:#ffb26b;--ink:#2b2f36;--sub:#8a919e;--line:#e8eaef;--green:#2fbf71;--red:#e5534b;--blue:#3b82f6;--purple:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{cursor:pointer;border:none;border-radius:10px;font-size:15px;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(30,35,60,.05);margin-bottom:14px}
.btn-pri{background:var(--pri);color:#fff;padding:10px 18px;font-weight:600}
.btn-pri:hover{background:#f57f26}.btn-ghost{background:#f0f1f5;color:var(--ink);padding:9px 14px}
.btn-green{background:var(--green);color:#fff;padding:10px 18px;font-weight:600}
.btn-red{background:var(--red);color:#fff;padding:6px 12px;font-size:13px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;color:#fff;margin-right:6px}
.t-choice{background:var(--blue)}.t-fill{background:var(--purple)}.t-judge{background:var(--green)}
.t-practice{background:var(--pri)}.t-daily{background:var(--blue)}.t-exam{background:var(--green)}.t-adjust{background:var(--sub)}
.muted{color:var(--sub);font-size:13px}
/* login */
#loginView{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.logo{font-size:64px}.login-card{width:100%;max-width:380px;margin-top:16px}
.role-pick{display:flex;gap:10px;margin-bottom:12px}
.role-pick button{flex:1;padding:14px;border-radius:12px;background:#f0f1f5;font-weight:600}
.role-pick button.on{background:var(--pri);color:#fff}
/* layout */
#appView{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:12px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:9}
.brand{font-weight:800;font-size:18px}.brand span{color:var(--pri)}
.balance-pill{background:#fff4e8;border:1px solid #ffd9ad;color:#d96c00;padding:6px 14px;border-radius:30px;font-weight:700}
.main{display:flex;max-width:1100px;margin:0 auto;gap:16px;padding:16px}
.nav{width:150px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
.nav button{text-align:left;padding:11px 14px;background:transparent;border-radius:10px;color:var(--ink);font-weight:500}
.nav button.on{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.content{flex:1;min-width:0}
h2{font-size:19px;margin-bottom:12px}
h3{font-size:16px;margin:14px 0 8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:linear-gradient(135deg,#fff7ef,#fff);border:1px solid #ffe3c2;border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:24px;display:block;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px}
.plus{color:var(--green);font-weight:700}.minus{color:var(--red);font-weight:700}
.q-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.q-stem{font-weight:600;margin:6px 0;white-space:pre-wrap}
.q-ans{font-size:14px;color:var(--sub)}
.q-ans b{color:var(--ink)}
.q-ana{background:#f6f8ff;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px;color:#43508a}
.bank-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bank-tabs button{padding:8px 16px;background:#f0f1f5;border-radius:20px;font-weight:600}
.bank-tabs button.on{background:var(--pri);color:#fff}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.opt{display:block;width:100%;text-align:left;background:#f6f7fb;padding:12px 14px;margin-bottom:8px;border-radius:10px;font-size:15px}
.opt:hover{background:#eceffd}
.opt.right{background:#e5f9ee;border:1px solid #9fe3bf}.opt.wrong{background:#fdeceb;border:1px solid #f3b3af}
.feedback{border-radius:12px;padding:14px;margin-top:12px;font-size:15px}
.feedback.ok{background:#e5f9ee;border:1px solid #9fe3bf}.feedback.no{background:#fdeceb;border:1px solid #f3b3af}
.coin-pop{position:fixed;left:50%;top:35%;transform:translateX(-50%);font-size:42px;font-weight:900;color:#f5a623;text-shadow:0 2px 12px rgba(245,166,35,.4);animation:coinfly 1.1s ease-out forwards;z-index:99;pointer-events:none}
@keyframes coinfly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}70%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(.9)}}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar{height:16px;background:var(--pri2);border-radius:4px;min-width:2px}
.bar2{height:16px;background:var(--green);border-radius:4px;min-width:2px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2b2f36;color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;z-index:99;opacity:.95}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.main{flex-direction:column}.nav{width:100%;flex-direction:row;overflow-x:auto}.form-grid{grid-template-columns:1fr}}
img.qimg{max-width:100%;border-radius:10px;margin-top:8px}
.pager{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-size:12px;background:#f0f1f5;border-radius:20px;padding:2px 9px;margin-left:6px;color:var(--sub)}
.mastered{color:var(--green);font-weight:700}
</style>
</head>

<script>
/* ================= 数据层 ================= */
const KEY='danbi_app_v3';
const BANKS={key:'重点题库',wrong:'错题库',similar:'同类型错题库'};
const TYPES={choice:'选择题',fill:'填空题',judge:'判断题'};
let db=null, me=null, curNav='home', curBank='similar', practice=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtTime(t){const d=new Date(t);return todayStr(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

const FIXED_ACCOUNTS=[['爸爸','parent'],['妈妈','parent'],['Eason','child']];
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
  if(!db){
    /* 迁移旧版数据：账号固定为爸爸/妈妈/Eason（密码重置为123456），保留题库与蛋币流水 */
    let old=null;
    try{old=JSON.parse(localStorage.getItem('danbi_app_v2'))}catch(e){}
    if(!old){try{old=JSON.parse(localStorage.getItem('danbi_app_v1'))}catch(e){}}
    if(old&&old.accounts){
      db={accounts:FIXED_ACCOUNTS.map(([n,r])=>{const o=old.accounts.find(a=>a.name===n);return {id:(o&&o.id)||uid(),name:n,role:r,pwd:'123456'}}),
          questions:old.questions||[],ledger:old.ledger||[],attempts:old.attempts||[],session:null};
      localStorage.removeItem('danbi_app_v2');localStorage.removeItem('danbi_app_v1');
    }else{
      db={accounts:[],questions:[],ledger:[],attempts:[],session:null};seed();
    }
    save();
  }
  /* 历史数据修正：练习奖励原因统一为固定文案 */
  let fixed=false;
  db.ledger.forEach(e=>{if(e.category==='practice'&&e.reason!=='同类型错题库：答对一题'){e.reason='同类型错题库：答对一题';fixed=true}});
  if(fixed)save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('保存失败：图片过大，存储空间不足')}}
function seed(){
  db.accounts=FIXED_ACCOUNTS.map(([n,r])=>({id:uid(),name:n,role:r,pwd:'123456'}));
  const mk=(type,stem,ans,ana)=>({id:uid(),bank:'similar',type,stem,answer:ans,analysis:ana,createdAt:Date.now(),deleted:false,source:'粘贴',correctCount:0,wrongCount:0,firstCorrectAt:null,image:null});
  db.questions=[
    mk('choice','小明有 3 个苹果，又买了 2 个，一共有几个？\nA. 4\nB. 5\nC. 6','B','3+2=5，所以选 B。'),
    mk('choice','下列哪个数是偶数？\nA. 3\nB. 7\nC. 8','C','8 能被 2 整除，是偶数。'),
    mk('fill','中国的首都是____。','北京','中国的首都是北京。'),
    mk('fill','3 + 5 = ____','8','3+5=8。'),
    mk('judge','0 是自然数。（对 / 错）','对','现行教材中 0 是自然数。'),
    mk('judge','三角形任意两边之和大于第三边。（对 / 错）','对','这是三角形的基本性质。'),
    {id:uid(),bank:'key',type:'fill',stem:'【重点】解方程：2x + 6 = 14',answer:'x=4',analysis:'2x=14-6=8，x=4。',createdAt:Date.now(),deleted:false,source:'粘贴',correctCount:0,wrongCount:0,firstCorrectAt:null,image:null},
    {id:uid(),bank:'wrong',type:'fill',stem:'【错题】36 ÷ 4 × 3 = ?（上次误算成 3）','answer':'27',analysis:'从左到右计算：36÷4=9，9×3=27。',createdAt:Date.now(),deleted:false,source:'拍照',correctCount:0,wrongCount:0,firstCorrectAt:null,image:null}
  ];
  db.ledger=[];

/* ================= 答案归一化 ================= */
function norm(s){return String(s||'').toLowerCase().replace(/[\s　]+/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))}
function normJudge(s){const v=norm(s);if(['对','正确','√','是','t','true','✓'].includes(v))return '对';if(['错','错误','×','否','f','false','x','✗'].includes(v))return '错';return v}
function checkAnswer(q,ans){
  if(q.type==='choice')return norm(ans)===norm(q.answer).replace(/[^a-z]/g,'');
  if(q.type==='judge')return normJudge(ans)===normJudge(q.answer);
  return norm(ans)===norm(q.answer);
}
/* 识别同一行内的选项："A 6刀 B 5刀 C 4刀" / "A.6刀 B.5刀" */
function parseInlineOpts(stem){
  const re=/([A-F])\s*[.、．]?\s*/g;
  const marks=[];let m;
  while((m=re.exec(stem))!==null){marks.push({letter:m[1],start:m.index,textStart:re.lastIndex})}
  /* 只认从 A 开始连续递增的序列，避免误判正文中的字母 */
  const seq=[];let expect='A';
  for(const mk of marks){
    if(mk.letter===expect){seq.push(mk);expect=String.fromCharCode(expect.charCodeAt(0)+1)}
    else if(mk.letter==='A'){seq.length=0;seq.push(mk);expect='B'}
  }
  if(seq.length<2)return null;
  const opts=[];
  for(let i=0;i<seq.length;i++){
    const end=i+1<seq.length?seq[i+1].start:stem.length;
    const txt=stem.slice(seq[i].textStart,end).trim();
    if(!txt)return null;
    opts.push(seq[i].letter+' '+txt);
  }
  return {stem:stem.slice(0,seq[0].start).trim(),opts};
}

function parsePaste(){
  const raw=document.getElementById('pasteText').value.trim();if(!raw){toast('请先粘贴内容');return}
  const blocks=raw.split(/\n\s*-{3,}\s*\n/).map(s=>s.trim()).filter(Boolean);
  let ok=0,skip=0;
  blocks.forEach(b=>{
    let type=curBank==='similar'?'fill':null,ans=null,ana='',stemLines=[];
    b.split('\n').forEach(line=>{
      let m=line.match(/^\s*【?题型】?\s*[:：]?\s*(选择|填空|判断)/);
      if(m){type=m[1]==='选择'?'choice':m[1]==='判断'?'judge':'fill';return}
      m=line.match(/^\s*(?:【?答案】?|答案)\s*[:：]\s*(.+)$/);
      if(m){ans=m[1].trim();return}
      m=line.match(/^\s*(?:【?讲解】?|解析)\s*[:：]\s*(.+)$/);
      if(m){ana=m[1].trim();return}
      stemLines.push(line);
    });
    const stem=stemLines.join('\n').trim();
    if(!stem||!ans){skip++;return}
    if(curBank==='similar'&&!type){skip++;return}
    const dup=db.questions.find(q=>q.bank===curBank&&!q.deleted&&norm(q.stem)===norm(stem));
    if(dup){skip++;return}
    db.questions.push({id:uid(),bank:curBank,type:type||'fill',stem,answer:ans,analysis:ana||'（暂无讲解）',createdAt:Date.now(),deleted:false,source:'粘贴',image:null,correctCount:0,wrongCount:0,firstCorrectAt:null});
    ok++;
  });
  save();toast('入库 '+ok+' 题'+(skip?'，跳过 '+skip+' 题（缺答案/题型或重复）':''));render();
}

  const gains=db.ledger.filter(e=>e.delta>0).reduce((s,e)=>s+e.delta,0);
  const losses=db.ledger.filter(e=>e.delta<0).reduce((s,e)=>s+e.delta,0);
  const rows=[...db.ledger].sort((a,b)=>b.time-a.time).map(e=>'<tr><td>'+fmtTime(e.time)+'</td><td><span class="tag '+CAT_TAG[e.category]+'">'+CAT_NAME[e.category]+'</span></td><td>'+esc(e.reason||'—')+'</td><td class="'+(e.delta>0?'plus':'minus')+'">'+(e.delta>0?'+':'')+e.delta+'</td><td class="muted">'+esc(e.operator)+'</td></tr>').join('');
  let forms='';
  if(isParent()){
    forms='<div class="card"><h3>📝 录入（自动记录时间）</h3>'
    +'<h3>① 日常表现</h3><div class="form-grid"><select id="dDir"><option value="1">加蛋币</option><option value="-1">减蛋币</option></select>'
    +'<input id="dNum" type="number" min="1" value="1" placeholder="数量"></div><div style="height:8px"></div>'
    +'<input id="dReason" placeholder="原因（必填），如：主动整理书桌">'
    +'<div style="height:8px"></div><button class="btn-pri" onclick="addDaily()">记录日常表现</button>'
    +'<h3>② 考试成绩</h3><input id="eContent" placeholder="考试内容（必填），如：数学期中考试 92 分">'
    +'<div style="height:8px"></div><div class="row"><input id="eNum" type="number" min="1" value="5" style="width:140px"><button class="btn-green" onclick="addExam()">记录考试成绩</button></div></div>';
  }else{
    forms='<div class="card"><p class="muted">👀 只读模式：蛋币由做题奖励和家长录入产生，孩子不能修改蛋币数量。</p></div>';
  }
  box.innerHTML='<h2>🥚 蛋币收集中心</h2>'
  +'<div class="card"><div class="stat-grid">'
  +'<div class="stat"><b>'+balance()+'</b>当前总蛋币</div>'
  +'<div class="stat"><b style="color:var(--green)">+'+gains+'</b>累计获得</div>'
  +'<div class="stat"><b style="color:var(--red)">'+losses+'</b>累计减少</div>'
  +'</div></div>'+forms
  +'<div class="card"><h3>📋 蛋币明细（获得 / 损失记录）</h3>'
  +(rows?'<table><tr><th>时间</th><th>分类</th><th>原因</th><th>变动</th><th>操作人</th></tr>'+rows+'</table>':'<p class="muted">暂无记录</p>')+'</div>';
}
function addDaily(){
  const g=id=>document.getElementById(id);
  const dir=parseInt(g('dDir').value),n=parseInt(g('dNum').value),r=g('dReason').value.trim();
  if(!r){toast('请填写原因');return}if(!(n>0)){toast('数量必须大于0');return}
  addLedger('daily',dir*n,r);save();toast('已记录：'+(dir>0?'+':'')+dir*n+' 🥚');render();
}
function addExam(){
  const g=id=>document.getElementById(id);
  const c=g('eContent').value.trim(),n=parseInt(g('eNum').value);
  if(!c){toast('请填写考试内容');return}if(!(n>0)){toast('数量必须大于0');return}
  addLedger('exam',n,c);save();toast('已记录考试成绩 +'+n+' 🥚');render();
}


/* ================= 账号页 ================= */
let editAcc=null; /* {id,mode:'rename'|'pwd'} */
function vAccount(box){
  box.innerHTML='<h2>👪 家庭账号</h2><div class="card">'
  +'<p class="muted" style="margin-bottom:10px">固定三个账号，不支持新增或删除；默认密码 123456，可随时修改或重置。</p>'
  +'<table><tr><th>账号</th><th>类型</th><th>操作</th></tr>'
  +db.accounts.map(a=>{
    const isSelf=a.id===me.id;
    let row='<tr><td>'+esc(a.name)+(isSelf?' <span class="chip">当前</span>':'')+'</td><td>'
      +(a.role==='parent'?'👨‍👩‍👧 家长（可加减蛋币）':'🧒 孩子（做题得币）')+'</td><td>'
      +'<button class="btn-ghost btn-sm" onclick="setEdit(\''+a.id+'\',\'rename\')">改名</button> '
      +'<button class="btn-ghost btn-sm" onclick="setEdit(\''+a.id+'\',\'pwd\')">修改密码</button> '
      +'<button class="btn-ghost btn-sm" onclick="resetPwd(\''+a.id+'\')">重置密码</button></td></tr>';
    if(editAcc&&editAcc.id===a.id){
      if(editAcc.mode==='rename'){
        row+='<tr><td colspan="3"><div class="row"><input id="editInp" style="max-width:200px" value="'+esc(a.name)+'" placeholder="新账号名" onkeydown="if(event.key===\'Enter\')saveRename(\''+a.id+'\')">'
          +'<button class="btn-pri btn-sm" onclick="saveRename(\''+a.id+'\')">保存</button>'
          +'<button class="btn-ghost btn-sm" onclick="setEdit(null)">取消</button></div></td></tr>';
      }else{
        row+='<tr><td colspan="3"><div class="row"><input id="editInp" type="password" style="max-width:180px" placeholder="新密码（至少4位）">'
          +'<input id="editInp2" type="password" style="max-width:180px" placeholder="再输入一次">'
          +'<button class="btn-pri btn-sm" onclick="savePwd(\''+a.id+'\')">保存</button>'
          +'<button class="btn-ghost btn-sm" onclick="setEdit(null)">取消</button></div></td></tr>';
      }
    }
    return row;
  }).join('')
  +'</table></div>';
}
function setEdit(id,mode){editAcc=id?{id,mode:mode||'rename'}:null;render();if(id)setTimeout(()=>{const i=document.getElementById('editInp');if(i){i.focus();i.select()}},60)}
function saveRename(id){
  const a=db.accounts.find(x=>x.id===id);if(!a)return;
  const n=document.getElementById('editInp').value.trim();
  if(!n){toast('账号名不能为空');return}
  if(db.accounts.some(x=>x.id!==id&&x.name===n)){toast('已存在同名账号');return}
  const old=a.name;a.name=n;
  /* 同步更新流水中的操作人名称 */
  db.ledger.forEach(e=>{if(e.operator===old)e.operator=n});
  editAcc=null;save();toast('已改名为：'+n);render();
}
function savePwd(id){
  const a=db.accounts.find(x=>x.id===id);if(!a)return;
  const p1=document.getElementById('editInp').value,p2=document.getElementById('editInp2').value;
  if(!p1||p1.length<4){toast('密码至少 4 位');return}
  if(p1!==p2){toast('两次输入的密码不一致');return}
  a.pwd=p1;editAcc=null;save();toast('「'+a.name+'」密码修改成功');render();
}
function resetPwd(id){
  const a=db.accounts.find(x=>x.id===id);if(!a)return;
  uiConfirm('将「'+a.name+'」的密码重置为默认密码 123456？',()=>{a.pwd='123456';save();toast('已重置为 123456');render()},'重置');
}

/* ================= 应用内确认弹窗（替代系统 confirm） ================= */
function uiConfirm(msg,cb,yesTxt){
  const mask=document.getElementById('modalMask'),box=document.getElementById('modalBox');
  box.innerHTML='<p style="margin-bottom:16px;line-height:1.6">'+esc(msg)+'</p>'
    +'<div class="row" style="justify-content:flex-end"><button class="btn-ghost btn-sm" id="mNo">取消</button>'
    +'<button class="btn-red" style="padding:8px 16px;font-size:14px" id="mYes">'+(yesTxt||'确认')+'</button></div>';
  mask.style.display='flex';
  document.getElementById('mNo').onclick=()=>{mask.style.display='none'};
  document.getElementById('mYes').onclick=()=>{mask.style.display='none';cb()};
}

/* ================= 工具 ================= */
let toastTimer=null;
function toast(msg){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2200)}


/* PWA：仅在 http(s) 环境下注册 Service Worker，file:// 直接跳过 */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ================= 启动 ================= */
load();
if(db.session){const acc=db.accounts.find(a=>a.id===db.session);if(acc){me=acc;enterApp()}}
</script>
</body>
</html>
